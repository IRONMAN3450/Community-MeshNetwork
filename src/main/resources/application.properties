spring.application.name=mesh2
server.port=${SERVER_PORT:18082}

# Keep the default-port application data separate from any older instance still using mesh2db.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/mesh2db-18082;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Available locally at http://localhost:18082/h2-console
spring.h2.console.enabled=${MESH_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

community.mesh.seed-demo-data=${MESH_SEED_DEMO_DATA:false}

# Set a password for one startup to provision the initial administrator account.
community.mesh.admin.email=${MESH_ADMIN_EMAIL:admin@communitymesh.local}
community.mesh.admin.password=${MESH_ADMIN_PASSWORD:}
community.mesh.admin.first-name=${MESH_ADMIN_FIRST_NAME:Rudra}
community.mesh.admin.last-name=${MESH_ADMIN_LAST_NAME:Mishra}
community.mesh.admin.phone=${MESH_ADMIN_PHONE:}
